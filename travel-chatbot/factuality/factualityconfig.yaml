# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Travel Chatbot - Factuality Evaluation

# Each test case supplies its own input to the chatbot endpoint.
prompts:
  - '{{input}}'
providers: file://providers.yaml
tests: file://inputs.yaml

defaultTest:
  assert:
    - type: factuality
      value: '{{expected}}'
  options:
    # OpenAI is used as the factuality grading provider.
    provider: openai:gpt-4.1-nano
    factuality:
      subset: 1
      superset: 1
      agree: 1
      disagree: 0
      differButFactual: 1
evaluateOptions: {}
derivedMetrics: []
