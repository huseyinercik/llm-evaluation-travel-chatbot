Bir varmış, bir yokmuş. Evvel zaman içinde, kalbur saman içinde,
    uzak dağların ardında küçük bir köy varmış. Bu köyde, annesiyle
    birlikte yaşayan Keloğlan adında zeki, meraklı ve biraz da tembel
    bir delikanlı varmış. Keloğlan’ın başında tek bir tel saç bulunurmuş.
    Bu yüzden herkes ona “Keloğlan” dermiş.

    Keloğlan’ın annesi geçimini küçük bahçelerinde yetiştirdikleri
    sebzeleri satarak sağlarmış. Ancak o yıl yağmurlar yağmamış,
    tarlalar kurumuş, köyde yiyecek azalmış. Bir gün annesi,
    mutfakta kalan son ekmek parçasını ikiye bölerek oğluna uzatmış.

    “Al oğlum,” demiş. “Bunu sen ye. Ben bugün komşudan biraz un isterim.”

    Keloğlan ekmeğe bakmış, sonra annesinin yorgun yüzünü görmüş.

    “Hayır ana,” demiş. “Sen yarısını ye. Ben ormana gidip bize
    yiyecek bir şeyler bulacağım.”

    Annesi şaşırmış. Çünkü Keloğlan çoğu zaman çalışmaktan kaçarmış.
    Fakat o gün oğlunun gözlerinde kararlı bir ifade varmış.

    Keloğlan eline eski sopasını alıp ormana doğru yola çıkmış.
    Bir süre yürüdükten sonra yaşlı bir ağacın altında yaralı bir
    tilki görmüş. Tilkinin ayağına diken batmış ve yürüyemiyormuş.

    Keloğlan hemen yanına oturmuş.

    “Bekle bakalım, seni kurtaracağım,” demiş.

    Dikeni dikkatlice çıkarmış, yarayı temizlemiş ve gömleğinden
    kopardığı bir parçayla tilkinin ayağını sarmış. Tilki ayağa
    kalkmış ve Keloğlan’a dikkatle bakmış.

    “İyilik yaptın,” demiş tilki. “Bunun karşılığını mutlaka
    göreceksin. Fakat ormanda dikkatli ol. Bugünlerde Padişah’ın
    hazinesinden çalınan sihirli bir elma yüzünden bütün ülke
    sıkıntı içinde.”

    Keloğlan şaşırmış.

    “Sihirli elma mı?”

    Tilki başını sallamış.

    “Evet. Bu elma, toprağa dikildiğinde gece boyunca altın
    çiçekler açtırır. Ancak elma kötü niyetli birinin eline
    geçerse bütün çiçekler solar, ülkeye kıtlık gelir.”

    Keloğlan yoluna devam etmiş. Akşamüstü, ormanın derinliklerinde
    küçük bir kulübeye rastlamış. Kulübenin önünde yaşlı bir kadın
    oturuyormuş. Kadın, elinde parıldayan kırmızı bir elma tutuyormuş.

    “Evlat,” demiş kadın, “çok yorulmuşsun. Gel, şu elmayı sen ye.”

    Keloğlan elmaya uzanacakken yaralı tilkinin sözlerini hatırlamış.
    Elmanın üzerindeki parlaklık normal değilmiş. Bu yaşlı kadının
    aslında kılık değiştirmiş bir cadı olduğunu anlamış.

    “Teşekkür ederim nine,” demiş. “Ama ben elmayı yemeden önce
    biraz su isterim. Şu kuyudan bana su verir misin?”

    Cadı kuyunun başına gidince Keloğlan elmayı alıp hızla kaçmış.
    Cadı arkasından bağırmış, fakat Keloğlan ormanın yollarını iyi
    bildiği için onu atlatmış.

    Ertesi sabah Keloğlan saraya gitmiş. Padişah, sihirli elmanın
    bulunduğunu öğrenince onu huzuruna çağırmış.

    “Eğer bu elmayı gerçekten bulduysan,” demiş Padişah,
    “onu sarayın bahçesine dik.”

    Keloğlan elmayı toprağa dikmiş. Gece olduğunda bahçede altın
    çiçekler açmış. Çiçeklerin ışığı bütün ülkeye yayılmış.
    Kuruyan tarlalar yeniden canlanmış, derelerden su akmaya
    başlamış, köylülerin ambarları dolmuş.

    Padişah çok sevinmiş ve Keloğlan’a büyük bir kese altın vermek
    istemiş. Keloğlan ise altınların yalnızca küçük bir bölümünü almış.

    “Padişahım,” demiş, “geri kalan altını köyümüzdeki fakirlere
    ve kuruyan tarlaların onarılmasına harcayın. Annemle benim
    ihtiyacımız olan çok fazla şey yok.”

    Padişah, Keloğlan’ın zekâsına ve cömertliğine hayran kalmış.
    Onu sarayda danışman yapmış. Keloğlan da artık tembelliği
    bırakıp her gün çalışmış.

    Köyüne döndüğünde annesi onu kapıda karşılamış. Keloğlan
    annesine sarılıp şöyle demiş:

    “Anacığım, insanın gerçek zenginliği altın değil; aklı,
    iyiliği ve paylaşmayı bilmesidir.”

    O günden sonra Keloğlan’ın adı bütün ülkede duyulmuş.
    Herkes onun kel kafasına değil, güzel kalbine ve keskin
    zekâsına bakmış. Ülke uzun yıllar bolluk içinde yaşamış.

    Gökten üç elma düşmüş: Biri iyilik yapanlara, biri paylaşmayı
    bilenlere, biri de bu masalı dinleyenlere.

